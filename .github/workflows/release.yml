name: Release to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由根 package.json 的 packageManager 字段决定，此处不传 version
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 遍历 packages/* 中的全部非 private 包，比对本地版本与 npm 已发布版本
      - name: Detect changed packages
        id: detect
        run: |
          CHANGED=""
          for DIR in packages/*; do
            [ -d "${DIR}" ] || continue
            NAME=$(node -p "require('./${DIR}/package.json').name || ''")
            [ -n "${NAME}" ] || continue
            if [ "$(node -p "require('./${DIR}/package.json').private === true")" = "true" ]; then
              echo "${NAME}: private，跳过"
              continue
            fi
            VERSION=$(node -p "require('./${DIR}/package.json').version")
            PUBLISHED=$(pnpm view "${NAME}" version 2>/dev/null || true)
            echo "${NAME}: local=${VERSION} published=${PUBLISHED}"
            if [ -z "${PUBLISHED}" ] || [ "${VERSION}" != "${PUBLISHED}" ]; then
              CHANGED="${CHANGED} ${NAME}"
            fi
          done
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: No version change, skip publish
        if: steps.detect.outputs.changed == ''
        run: echo "没有包版本与 npm 不一致，跳过发布"

      - name: Build packages
        if: steps.detect.outputs.changed != ''
        run: pnpm build:packages

      - name: Lint check
        if: steps.detect.outputs.changed != ''
        run: pnpm exec biome check .

      - name: Test
        if: steps.detect.outputs.changed != ''
        run: pnpm test

      - name: Publish changed packages
        if: steps.detect.outputs.changed != ''
        env:
          CHANGED: ${{ steps.detect.outputs.changed }}
          # 发布顺序：被依赖的包在前。新增库需按依赖关系追加到此列表
          PUBLISH_ORDER: '@easyx/tiptap-table-plus @easyx/editor @easyx/ai-rich-editor @easyx/image-toolkit'
        run: |
          for NAME in ${CHANGED}; do
            case " ${PUBLISH_ORDER} " in
              *" ${NAME} "*) ;;
              *) echo "::error::${NAME} 未登记在 PUBLISH_ORDER 中，请按依赖顺序补充后再发布"; exit 1 ;;
            esac
          done

          for NAME in ${PUBLISH_ORDER}; do
            case " ${CHANGED} " in
              *" ${NAME} "*) ;;
              *) continue ;;
            esac
            echo "::group::发布 ${NAME}"
            pnpm --filter "${NAME}" publish --no-git-checks --access public
            echo "::endgroup::"
          done

      - name: 飞书通知（发布成功）
        if: success() && steps.detect.outputs.changed != ''
        uses: ./.github/actions/feishu-notify
        with:
          status: success
          workflow: Release to npm
          webhook: ${{ secrets.FEISHU_WEBHOOK }}
          packages: ${{ steps.detect.outputs.changed }}

      - name: 飞书通知（发布失败）
        if: failure() && steps.detect.outputs.changed != ''
        uses: ./.github/actions/feishu-notify
        with:
          status: failure
          workflow: Release to npm
          subject: 发布
          webhook: ${{ secrets.FEISHU_WEBHOOK }}
          packages: ${{ steps.detect.outputs.changed }}
