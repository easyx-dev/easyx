name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由根 package.json 的 packageManager 字段决定，此处不传 version
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Build site
        run: pnpm --filter site build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 飞书通知（部署成功）
        if: always() && jobs.build.result == 'success' && jobs.deploy.result == 'success'
        uses: ./.github/actions/feishu-notify
        with:
          status: success
          workflow: Deploy to GitHub Pages
          subject: 部署
          webhook: ${{ secrets.FEISHU_WEBHOOK }}

      - name: 飞书通知（部署失败）
        if: always() && (jobs.build.result == 'failure' || jobs.deploy.result == 'failure')
        uses: ./.github/actions/feishu-notify
        with:
          status: failure
          workflow: Deploy to GitHub Pages
          subject: 部署
          webhook: ${{ secrets.FEISHU_WEBHOOK }}
